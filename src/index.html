<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solana Data Aggregator</title>
<style>
  :root {
    --bg: #0a0b10; --panel: rgba(255,255,255,.035); --panel2: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.14);
    --text: #eef1f6; --muted: #8b93a7;
    --purple: #9945ff; --green: #14f195; --cyan: #19d3f5;
    --accent: #9945ff; --accent2: #14f195; --ok: #14f195; --fail: #ff5c72;
    --chip: rgba(255,255,255,.06);
    --grad: linear-gradient(120deg, #9945ff 0%, #7d5cff 42%, #14f195 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 520px at -6% -12%, rgba(153,69,255,.20), transparent 60%),
      radial-gradient(880px 500px at 106% -4%, rgba(20,241,149,.13), transparent 55%);
    background-attachment: fixed;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 18px 26px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,11,16,.55); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 5;
  }
  header .logo { width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: var(--grad); box-shadow: 0 0 20px rgba(153,69,255,.5); }
  header h1 {
    font-size: 19px; margin: 0; font-weight: 750; letter-spacing: -.3px;
    background: linear-gradient(90deg, #ffffff, #dcc9ff 52%, #9bf6cf);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .health { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: .3s; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.bad { background: var(--fail); box-shadow: 0 0 10px var(--fail); }
  main { max-width: 1220px; margin: 0 auto; padding: 24px 26px 64px; }
  .controls {
    display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 12px;
    align-items: end; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 20px; backdrop-filter: blur(8px);
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; font-weight: 600; }
  input, select, button {
    background: rgba(255,255,255,.04); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; outline: none; transition: .15s;
  }
  input:focus, select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(153,69,255,.22); }
  input.pubkey { font-family: ui-monospace, monospace; }
  button { cursor: pointer; font-weight: 650; white-space: nowrap; }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--grad); border-color: transparent; color: #0a0b10; font-weight: 750;
    box-shadow: 0 6px 18px rgba(153,69,255,.28); }
  button.primary:hover { box-shadow: 0 8px 26px rgba(20,241,149,.32); }
  button.ghost { background: var(--chip); border-color: var(--border2); }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
  .stat { position: relative; flex: 1; min-width: 160px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px; overflow: hidden; backdrop-filter: blur(8px); }
  .stat::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--grad); opacity: .85; }
  .stat .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; font-weight: 600; }
  .stat .v { font-size: 24px; font-weight: 750; margin-top: 5px; letter-spacing: -.3px; }
  .stat .v.mono { font-size: 16px; }
  .tablewrap { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow-x: auto; backdrop-filter: blur(8px); }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; font-weight: 600;
    position: sticky; top: 0; background: rgba(14,16,23,.92); backdrop-filter: blur(4px); }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: rgba(153,69,255,.07); }
  tbody tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; }
  .badge.transfer { background: rgba(20,241,149,.14); color: var(--green); border: 1px solid rgba(20,241,149,.32); }
  .badge.vote { background: rgba(130,150,180,.15); color: #a8b6cc; border: 1px solid rgba(130,150,180,.26); }
  .badge.token { background: rgba(153,69,255,.18); color: #c9a3ff; border: 1px solid rgba(153,69,255,.36); }
  .badge.other { background: rgba(255,180,60,.13); color: #ffc25e; border: 1px solid rgba(255,180,60,.28); }
  .status-ok { color: var(--ok); } .status-fail { color: var(--fail); font-weight: 700; }
  a.sig { color: #8ab4ff; text-decoration: none; }
  a.sig:hover { color: var(--cyan); text-decoration: underline; }
  .muted { color: var(--muted); }
  .arrow { color: var(--green); }
  .msg { padding: 44px; text-align: center; color: var(--muted); }
  .msg.error { color: var(--fail); }
  .transfer-cell { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div>
    <h1>Solana Data Aggregator</h1>
    <div class="sub">Real-time transaction indexer</div>
  </div>
  <div class="health"><span id="health-dot" class="dot"></span><span id="health-text">checking…</span></div>
</header>

<main>
  <div class="controls">
    <div class="field"><label for="network">Network</label>
      <select id="network" title="Which cluster's data to view. Populated from the accounts the server is monitoring."></select>
    </div>
    <div class="field" style="grid-column: 2 / 3;">
      <label for="pubkey">Monitored account (pub_key)</label>
      <input id="pubkey" class="pubkey" list="accounts-list" placeholder="Account public key (base58) — pick a monitored account or paste one" />
      <datalist id="accounts-list"></datalist>
    </div>
    <div class="field"><label for="limit">Limit</label><input id="limit" type="number" min="1" value="25" style="width:80px" /></div>
    <div class="field"><label for="offset">Offset</label><input id="offset" type="number" min="0" value="0" style="width:80px" /></div>
    <div class="field"><label>&nbsp;</label><button id="load" class="primary">Load</button></div>
    <div class="field"><label>&nbsp;</label><button id="refresh" class="ghost" title="Ask the backend to fetch new transactions from the chain">Refresh chain</button></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Transactions shown</div><div class="v" id="s-count">—</div></div>
    <div class="stat"><div class="k">Account balance</div><div class="v mono" id="s-balance">—</div></div>
    <div class="stat"><div class="k">Total fees (shown)</div><div class="v mono" id="s-fees">—</div></div>
    <div class="stat"><div class="k">SOL transferred (shown)</div><div class="v mono" id="s-transfer">—</div></div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>Type</th><th>Status</th><th>Fee</th><th>Fee payer</th><th>Slot</th><th>Transfer / tokens</th><th>Time</th><th>Signature</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8"><div class="msg">Enter a public key and press <b>Load</b>.</div></td></tr></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const LAMPORTS = 1e9;
const sol = (l) => (l / LAMPORTS).toLocaleString(undefined, { maximumFractionDigits: 9 }) + " SOL";
const short = (s, n = 4) => s ? s.slice(0, n) + "…" + s.slice(-n) : "";
const badgeClass = (t) => ["transfer", "vote", "token"].includes(t) ? t : "other";

async function checkHealth() {
  try {
    const r = await fetch("/health"); const j = await r.json();
    const ok = j.status === "ok";
    $("health-dot").className = "dot " + (ok ? "ok" : "bad");
    $("health-text").textContent = ok ? "backend online" : "backend degraded";
  } catch {
    $("health-dot").className = "dot bad"; $("health-text").textContent = "backend offline";
  }
}

// Map a monitored-network name to the Solana Explorer cluster for links.
const NETWORK_CLUSTER = { mainnet: "mainnet-beta", "mainnet-beta": "mainnet-beta", devnet: "devnet", testnet: "testnet" };
const explorerCluster = (net) => NETWORK_CLUSTER[net] || "mainnet-beta";
let networksData = {};  // network name -> accounts[]

async function loadBalance(pk, network) {
  $("s-balance").textContent = "…";
  try {
    const r = await fetch(`/accounts/${encodeURIComponent(pk)}/balance?network=${encodeURIComponent(network)}`);
    const j = await r.json();
    $("s-balance").textContent = j.balance != null ? sol(j.balance) : (j.error || "—");
  } catch { $("s-balance").textContent = "—"; }
}

function render(txs, cluster) {
  const rows = $("rows");
  if (!Array.isArray(txs) || txs.length === 0) {
    rows.innerHTML = `<tr><td colspan="8"><div class="msg">No transactions stored for this account yet. Try <b>Refresh chain</b>, then Load.</div></td></tr>`;
    $("s-count").textContent = "0"; $("s-fees").textContent = "0 SOL"; $("s-transfer").textContent = "0 SOL";
    return;
  }
  let totalFee = 0, totalTransfer = 0;
  rows.innerHTML = txs.map((t) => {
    totalFee += t.fee || 0;
    const tr = t.transfer;
    if (tr) totalTransfer += tr.lamports || 0;
    const when = t.timestamp ? new Date(t.timestamp * 1000).toLocaleString() : "—";
    const parts = [];
    if (tr) {
      parts.push(`<span class="transfer-cell">${sol(tr.lamports)}<br><span class="muted">${short(tr.source)} <span class="arrow">→</span> ${short(tr.destination)}</span></span>`);
    }
    for (const tc of (t.token_changes || [])) {
      const amt = tc.ui_change > 0 ? `+${tc.ui_change}` : `${tc.ui_change}`;
      const cls = tc.ui_change >= 0 ? "status-ok" : "status-fail";
      parts.push(`<span class="transfer-cell"><span class="${cls}">${amt}</span> <span class="muted">${short(tc.mint)}</span></span>`);
    }
    const transferCell = parts.length ? parts.join("<br>") : `<span class="muted">—</span>`;
    const url = `https://explorer.solana.com/tx/${t.signature}?cluster=${cluster}`;
    return `<tr>
      <td><span class="badge ${badgeClass(t.tx_type)}">${t.tx_type}</span></td>
      <td class="${t.success ? "status-ok" : "status-fail"}">${t.success ? "✓ ok" : "✗ fail"}</td>
      <td class="mono">${sol(t.fee)}</td>
      <td class="mono" title="${t.fee_payer}">${short(t.fee_payer, 6)}</td>
      <td class="mono">${t.slot?.toLocaleString?.() ?? t.slot}</td>
      <td>${transferCell}</td>
      <td class="muted">${when}</td>
      <td><a class="sig" href="${url}" target="_blank" rel="noopener" title="${t.signature}">${short(t.signature, 6)}</a></td>
    </tr>`;
  }).join("");
  $("s-count").textContent = txs.length;
  $("s-fees").textContent = sol(totalFee);
  $("s-transfer").textContent = sol(totalTransfer);
}

let lastTxs = [];  // last-loaded rows, so re-rendering (e.g. on cluster change) needs no refetch

async function load() {
  const pk = $("pubkey").value.trim();
  if (!pk) { $("pubkey").focus(); return; }
  const network = $("network").value;
  const limit = $("limit").value || 25, offset = $("offset").value || 0;
  $("load").disabled = true;
  $("rows").innerHTML = `<tr><td colspan="8"><div class="msg">Loading…</div></td></tr>`;
  try {
    const r = await fetch(`/transactions?network=${encodeURIComponent(network)}&pub_key=${encodeURIComponent(pk)}&limit=${limit}&offset=${offset}`);
    const txs = await r.json();
    lastTxs = Array.isArray(txs) ? txs : [];
    render(txs, explorerCluster(network));
    loadBalance(pk, network);
  } catch (e) {
    $("rows").innerHTML = `<tr><td colspan="8"><div class="msg error">Failed to load: ${e}</div></td></tr>`;
  } finally { $("load").disabled = false; }
}

async function refreshChain() {
  const btn = $("refresh"); btn.disabled = true; const orig = btn.textContent; btn.textContent = "Refreshing…";
  try { await fetch("/refresh", { method: "POST" }); setTimeout(load, 1500); }
  catch {} finally { setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 1500); }
}

function resetView(msg) {
  $("pubkey").value = "";
  lastTxs = [];
  $("rows").innerHTML = `<tr><td colspan="8"><div class="msg">${msg}</div></td></tr>`;
  for (const id of ["s-count", "s-balance", "s-fees", "s-transfer"]) $(id).textContent = "—";
}

// Fill the account picker's datalist for the selected network.
function populateAccounts(network) {
  const accts = networksData[network] || [];
  $("accounts-list").innerHTML = accts.map((a) => `<option value="${a}">`).join("");
}

// Populate the network dropdown + per-network accounts from the backend.
async function loadNetworks() {
  try {
    const r = await fetch("/networks");
    const nets = await r.json();
    if (!Array.isArray(nets) || !nets.length) return;
    networksData = {};
    for (const n of nets) networksData[n.name] = n.accounts || [];
    $("network").innerHTML = nets.map((n) => `<option value="${n.name}">${n.name}</option>`).join("");
    populateAccounts($("network").value);
  } catch {}
}

$("load").addEventListener("click", load);
$("refresh").addEventListener("click", refreshChain);
$("pubkey").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
// Switching network changes the data source: repopulate accounts and clear the view.
$("network").addEventListener("change", () => {
  populateAccounts($("network").value);
  resetView("Pick an account and press <b>Load</b>.");
});

loadNetworks();
checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
