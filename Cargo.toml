[package]
name = "solana-data-aggregator"
version = "0.1.0"
edition = "2021"




[dependencies]
tokio = { version = "1.39.0", features = ["full"] }
warp = { version = "0.4.2", features = ["server", "test"] }
solana-client = "3.0.0"
solana-sdk = "3.0.0"
solana-transaction-status = "3.0.0"
serde_json = "1.0.117"
serde = { version = "1.0.204", features = ["derive"] }
futures = "0.3.30"
thiserror = "2.0.16"
dotenv = "0.15.0"
log = "0.4.22"
env_logger = "0.11.8"
chrono = "0.4.39"