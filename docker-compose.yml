services:
  postgres:
    image: postgres:16-alpine
    container_name: solana-aggregator-db
    environment:
      POSTGRES_USER: solana
      POSTGRES_PASSWORD: solana
      POSTGRES_DB: solana_aggregator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solana -d solana_aggregator"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
